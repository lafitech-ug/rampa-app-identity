<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The invite code travels in the URL: never pass it to the stores or
         anyone else in a Referer header. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title id="page-title">Te invitaron a Rampa</title>
    <style>
      :root {
        color-scheme: light dark;
        --violet: #784ae5;
        --aqua: #22d0ea;
        --text: #11181c;
        --muted: #5f6873;
        --bg: #ffffff;
        --surface: #f4f6ff;
        --border: #e6e8ec;
        --button-border: #c9cfd6;
        --pill-bg: #0c0c0c;
        --pill-fg: #ffffff;
        --ok-bg: #ecfdf5;
        --ok-text: #0b7a52;
        --ok-border: #34d399;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text: #ecedee;
          --muted: #a3abb5;
          --bg: #0c0c0c;
          --surface: rgba(255, 255, 255, 0.04);
          --border: #383c41;
          --button-border: #4a4f57;
          --pill-bg: #ffffff;
          --pill-fg: #0c0c0c;
          --ok-bg: #0c1f17;
          --ok-text: #34d399;
          --ok-border: #065f46;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top,
            rgba(120, 74, 229, 0.14),
            transparent 36rem
          ),
          var(--bg);
      }

      main {
        width: min(100%, 380px);
        display: grid;
        justify-items: center;
        gap: 20px;
        text-align: center;
      }

      .brand {
        display: grid;
        justify-items: center;
        gap: 6px;
        color: var(--violet);
      }

      .brand svg {
        width: 72px;
        height: 60px;
        fill: currentColor;
      }

      .brand span {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.18em;
        line-height: 1;
        padding-left: 0.18em;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      [hidden] {
        display: none !important;
      }

      .card {
        width: 100%;
        display: grid;
        gap: 14px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 4px;
        background: linear-gradient(90deg, var(--aqua), var(--violet));
      }

      .code {
        margin: 0;
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--text);
        user-select: all;
        -webkit-user-select: all;
      }

      .code .prefix {
        color: var(--muted);
      }

      .code .gap {
        display: inline-block;
        width: 10px;
      }

      .hint {
        width: 100%;
      }

      button,
      .button {
        appearance: none;
        width: 100%;
        min-height: 48px;
        border-radius: 24px;
        border: 1px solid transparent;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
      }

      button svg,
      .button svg {
        flex-shrink: 0;
      }

      .primary {
        background: var(--pill-bg);
        color: var(--pill-fg);
      }

      .outline {
        background: transparent;
        color: var(--text);
        border-color: var(--button-border);
      }

      .copied {
        background: var(--ok-bg);
        color: var(--ok-text);
        border-color: var(--ok-border);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" role="img" aria-label="Rampa">
        <svg viewBox="0 0 188 155" aria-hidden="true">
          <path d="M22.75 18.058C31.584 30.097 37.084 37.287 39.25 39.628c2.167 2.341 3.834 3.845 5 4.514 1.167.669 2.334 1.17 3.5 1.505 1.167.335 10.834.502 29 .502 18.167 0 28.584.25 31.25.752 2.667.502 5.417 1.505 8.25 3.01 2.834 1.505 5.084 3.01 6.75 4.515 1.667 1.504 3.417 3.511 5.25 6.019 1.834 2.508 4.417 7.858 7.75 16.052 3.334 8.193 5 12.457 5 12.791 0 .167 0 .335-.167.502-.166-.084-.333-.167-.5-.251-.333-.167-1.667-2.006-4-5.518-2.333-3.511-5.167-7.107-8.5-10.785-3.333-3.679-6.25-6.438-8.75-8.277-2.5-1.84-5.5-3.428-9-4.766-3.5-1.338-22.75-2.09-57.75-2.257-17.5-.084-35-.167-52.5-.251 2.584 3.678 5.167 7.357 7.75 11.035 5.167 7.357 10 13.795 14.5 19.313 4.5 5.517 8.25 9.028 11.25 10.533 3 1.505 11 2.257 24 2.257 13 0 20.5.334 22.5 1.003 2 .669 4.084 2.174 6.25 4.515 2.167 2.341 7.417 9.447 15.75 21.319 8.334 11.872 13.25 18.56 14.75 20.065 1.5 1.504 3.25 2.842 5.25 4.013 2 1.17 4.25 2.006 6.75 2.508 2.5.501 13 .752 31.5.752h27.75c-7.333-10.116-14.667-20.232-22-30.348-7.333-10.116-14.667-20.232-22-30.348 1.584-.585 3.167-1.17 4.75-1.756 3.167-1.17 6.584-3.344 10.25-6.521 3.667-3.177 6.75-6.856 9.25-11.036 2.5-4.18 4.167-7.608 5-10.283.834-2.675 1.417-6.186 1.75-10.534.334-4.347.25-8.276-.25-11.788-.5-3.511-1.833-7.775-4-12.791-2.167-5.016-4.75-9.28-7.75-12.791-3-3.511-6.917-6.688-11.75-9.531-4.833-2.842-9.5-4.765-14-5.768C132.75.502 110.333 0 70 0H9.5c4.417 6.019 8.834 12.039 13.25 18.058Z" />
        </svg>
        <span>RAMPA</span>
      </div>
      <h1 id="heading">Te invitaron a Rampa</h1>
      <p id="message">
        Mueve y ahorra tu dinero entre países y sigue presente en la vida de
        los que amas.
      </p>

      <section class="card" id="code-card" hidden aria-labelledby="code-label">
        <p id="code-label">Tu código de invitación</p>
        <p class="code" id="code"></p>
        <button type="button" class="outline" id="copy-button">
          <svg id="copy-icon" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path id="copy-icon-path" d="M9 9h11v11H9zM5 15V5h10" />
          </svg>
          <span id="copy-label">Copiar código</span>
        </button>
      </section>

      <p class="hint" id="hint" hidden>
        Copia el código y descarga Rampa. Al terminar tu registro, la app te lo
        pedirá.
      </p>

      <a class="button primary" id="download" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4v11M7 10l5 5 5-5M5 20h14" />
        </svg>
        <span id="download-label">Descargar Rampa</span>
      </a>
    </main>

    <script>
      // Plain static page: no cookies, no storage, no analytics, no
      // third-party requests (TDDDG §25). Everything below runs locally; the
      // only network use is the person tapping a store link.
      const COPY = {
        es: {
          lang: "es",
          title: "Te invitaron a Rampa",
          heading: "Te invitaron a Rampa",
          headingNoCode: "Únete a Rampa",
          message:
            "Mueve y ahorra tu dinero entre países y sigue presente en la vida de los que amas.",
          codeLabel: "Tu código de invitación",
          copy: "Copiar código",
          copied: "Código copiado",
          hint: "Copia el código y descarga Rampa. Al terminar tu registro, la app te lo pedirá.",
          download: "Descargar Rampa",
        },
        en: {
          lang: "en",
          title: "You've been invited to Rampa",
          heading: "You've been invited to Rampa",
          headingNoCode: "Join Rampa",
          message:
            "Move and save your money across borders, and stay present in the lives of the people you love.",
          codeLabel: "Your invite code",
          copy: "Copy code",
          copied: "Code copied",
          hint: "Copy the code and download Rampa. Once you finish signing up, the app will ask you for it.",
          download: "Download Rampa",
        },
      };
      const browserLocale = (
        navigator.language ||
        (navigator.languages && navigator.languages[0]) ||
        "en"
      ).toLowerCase();
      const copy = browserLocale.startsWith("es") ? COPY.es : COPY.en;

      const $ = (id) => document.getElementById(id);

      // Same format as the backend generator (rampa-api:
      // src/domain/referral/referral-code.ts): REF- + 8 characters without
      // 0, O, 1 or I. Anything else is ignored, never echoed back.
      const REFERRAL_CODE_PATTERN = /^REF-[A-HJ-NP-Z2-9]{8}$/;
      const rawRef = new URLSearchParams(window.location.search).get("ref");
      const candidate = (rawRef || "").trim().toUpperCase();
      const code = REFERRAL_CODE_PATTERN.test(candidate) ? candidate : null;
      // The app only sends the inviter's first name. Limit it before showing
      // it: this static page never interpolates HTML, but a bounded label
      // prevents a malformed URL from becoming an unusable heading.
      const rawName = new URLSearchParams(window.location.search).get("name") || "";
      const inviterName = rawName.replace(/\s+/g, " ").trim().slice(0, 48);

      const ANDROID_PACKAGE = "com.anonymous.rampaapp";
      // The Play Store hands `referrer` to the app after install; the app's
      // Play Install Referrer reader takes the code from utm_campaign and
      // prefills "Acceso con código" with it.
      const PLAY_STORE_URL =
        `https://play.google.com/store/apps/details?id=${ANDROID_PACKAGE}` +
        (code ? `&referrer=utm_campaign%3D${code}` : "");
      // Apple-assigned public listing id (https://apps.apple.com/app/id6756196244).
      // Keep in sync with the app's APP_STORE_ID (rampa-app: src/shared/config/appStore.ts).
      const APP_STORE_ID = "6756196244";
      const APP_STORE_URL = `https://apps.apple.com/app/id${APP_STORE_ID}`;

      // Release-readiness guard: fail loudly if the listing URL is ever missing
      // or malformed (e.g. reverted to a generic search) instead of silently
      // sending iOS users to the wrong destination.
      const APP_STORE_URL_PATTERN =
        /^https:\/\/apps\.apple\.com\/(?:[a-z]{2}\/)?app\/id\d{5,}$/;
      if (!APP_STORE_URL_PATTERN.test(APP_STORE_URL)) {
        throw new Error(`Invalid APP_STORE_URL: ${APP_STORE_URL}`);
      }

      const userAgent = navigator.userAgent || navigator.vendor || "";
      const isAndroid = /android/i.test(userAgent);

      document.documentElement.lang = copy.lang;
      $("page-title").textContent = code ? copy.title : copy.headingNoCode;
      $("heading").textContent = code
        ? (inviterName
          ? (copy.lang === "es" ? `${inviterName} te invita a Rampa` : `${inviterName} invites you to Rampa`)
          : copy.heading)
        : copy.headingNoCode;
      $("message").textContent = copy.message;
      $("code-label").textContent = copy.codeLabel;
      $("copy-label").textContent = copy.copy;
      $("hint").textContent = copy.hint;
      $("download-label").textContent = copy.download;
      // Android: Google Play, carrying the code. Everything else (iPhone,
      // iPad, desktop): the App Store, which can't carry it, hence "Copiar".
      $("download").href = isAndroid ? PLAY_STORE_URL : APP_STORE_URL;

      if (code) {
        const [body1, body2] = [code.slice(4, 8), code.slice(8)];
        const codeEl = $("code");
        codeEl.textContent = "";
        const prefix = document.createElement("span");
        prefix.className = "prefix";
        prefix.textContent = "REF-";
        const gap = document.createElement("span");
        gap.className = "gap";
        gap.setAttribute("aria-hidden", "true");
        codeEl.append(prefix, body1, gap, body2);
        codeEl.setAttribute("aria-label", code.split("").join(" "));
        $("code-card").hidden = false;
        $("hint").hidden = false;
      }

      const COPY_ICON = "M9 9h11v11H9zM5 15V5h10";
      const CHECK_ICON = "M5 12.5l4.5 4.5L19 7.5";
      let resetTimer = null;

      const copyCode = async () => {
        if (!code) return;
        let copied = false;
        try {
          await navigator.clipboard.writeText(code);
          copied = true;
        } catch {
          // Older browsers: select the code and use the legacy command.
          const range = document.createRange();
          range.selectNodeContents($("code"));
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          try {
            copied = document.execCommand("copy");
          } catch {
            copied = false;
          }
        }
        if (!copied) return;

        const button = $("copy-button");
        button.className = "copied";
        $("copy-label").textContent = copy.copied;
        $("copy-icon-path").setAttribute("d", CHECK_ICON);
        window.clearTimeout(resetTimer);
        resetTimer = window.setTimeout(() => {
          button.className = "outline";
          $("copy-label").textContent = copy.copy;
          $("copy-icon-path").setAttribute("d", COPY_ICON);
        }, 2000);
      };
      $("copy-button").addEventListener("click", copyCode);
    </script>
  </body>
</html>
